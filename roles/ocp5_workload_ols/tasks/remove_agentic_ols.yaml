---
# ================================
# Agentic OLS Teardown
# Calls individual undeploy scripts rather than uninstall.sh to avoid
# deleting the openshift-lightspeed namespace (shared with classic OLS).
# ================================

- name: Create temp directory for agentic operator repo clone
  ansible.builtin.tempfile:
    state: directory
    suffix: _agentic_ols_remove
  register: r_agentic_remove_tmp

- name: Clone agentic operator repo (shallow)
  ansible.builtin.git:
    repo: "{{ ocp5_workload_ols_agentic_repo_url }}"
    version: "{{ ocp5_workload_ols_agentic_repo_version }}"
    dest: "{{ r_agentic_remove_tmp.path }}/repo"
    depth: 1
    single_branch: true

- name: Log in to OpenShift cluster for undeploy scripts
  ansible.builtin.shell:
    cmd: >
      oc login {{ openshift_api_url }}
      --token={{ openshift_api_key }}
      --insecure-skip-tls-verify=true
    executable: /bin/bash
  changed_when: true
  no_log: true

- name: Undeploy console plugin
  when: ocp5_workload_ols_agentic_enable_console | bool
  ansible.builtin.shell:
    cmd: bash undeploy-console.sh
    chdir: "{{ r_agentic_remove_tmp.path }}/repo/hack/quickstart"
    executable: /bin/bash
  environment:
    NAMESPACE: "{{ ocp5_workload_ols_namespace }}"
  changed_when: true

- name: Undeploy operator (removes CRDs, CRs, RBAC, webhook)
  ansible.builtin.shell:
    cmd: bash undeploy-operator.sh
    chdir: "{{ r_agentic_remove_tmp.path }}/repo/hack/quickstart"
    executable: /bin/bash
  environment:
    NAMESPACE: "{{ ocp5_workload_ols_namespace }}"
  changed_when: true

- name: Undeploy configuration ConfigMap
  ansible.builtin.shell:
    cmd: bash undeploy-configmap.sh
    chdir: "{{ r_agentic_remove_tmp.path }}/repo/hack/quickstart"
    executable: /bin/bash
  environment:
    NAMESPACE: "{{ ocp5_workload_ols_namespace }}"
  changed_when: true

- name: Undeploy alerts adapter
  when: ocp5_workload_ols_agentic_enable_alerts_adapter | bool
  ansible.builtin.shell:
    cmd: bash undeploy-alerts-adapter.sh
    chdir: "{{ r_agentic_remove_tmp.path }}/repo/hack/quickstart"
    executable: /bin/bash
  environment:
    NAMESPACE: "{{ ocp5_workload_ols_namespace }}"
  changed_when: true

- name: Undeploy OTEL collector
  ansible.builtin.shell:
    cmd: bash undeploy-otel.sh
    chdir: "{{ r_agentic_remove_tmp.path }}/repo/hack/quickstart"
    executable: /bin/bash
  environment:
    NAMESPACE: "{{ ocp5_workload_ols_namespace }}"
  changed_when: true

- name: Remove llm-creds-openai secret
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: llm-creds-openai
    namespace: "{{ ocp5_workload_ols_namespace }}"

- name: Scale classic OLS operator back up
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: lightspeed-operator-controller-manager
    namespace: "{{ ocp5_workload_ols_namespace }}"
    definition:
      spec:
        replicas: 1
    merge_type: merge

- name: Remove temp repo clone
  ansible.builtin.file:
    path: "{{ r_agentic_remove_tmp.path }}"
    state: absent
