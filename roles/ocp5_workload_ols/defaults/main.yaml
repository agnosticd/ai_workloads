---
# Install the Operator from OperatorHub
ocp5_workload_ols_install_operator: true

# --------------------------------
# Operator deployment
# --------------------------------

# Namespace to install OLS into
ocp5_workload_ols_namespace: openshift-lightspeed

# --------------------------------
# OLS Operator Settings
# --------------------------------

# Channel to use for the OLS operator subscription
ocp5_workload_ols_channel: stable

# Set automatic InstallPlan approval
# Note: This variable is ignored when using a catalog snapshot
# (install plan approval is always automatic with catalog snapshots)
ocp5_workload_ols_automatic_install_plan_approval: true

# Set a starting ClusterServiceVersion (leave empty for latest)
ocp5_workload_ols_starting_csv: ""

# CSV name prefix for the operator
ocp5_workload_ols_csv_nameprefix: lightspeed-operator

# --------------------------------
# Operator Catalog Snapshot Settings
# --------------------------------

# Use a catalog snapshot (default: false)
ocp5_workload_ols_use_catalog_snapshot: false

# Catalog source name (should be unique in the cluster)
ocp5_workload_ols_catalogsource_name: openshift-lightspeed-operator-catalog
ocp5_workload_ols_catalogsource_namespace: openshift-marketplace

# Catalog snapshot image and tag
ocp5_workload_ols_catalog_snapshot_image: quay.io/openshift-lightspeed/lightspeed-catalog
ocp5_workload_ols_catalog_snapshot_image_tag: "stable-v0.1.0"

# --------------------------------
# OLS Configuration
# --------------------------------

# AI Platform to use: azure, openai, watson, openshiftai
ocp5_workload_ols_ai_platform: azure

ocp5_workload_ols_introspection_enabled: true

# --------------------------------
# Authentication Configuration
# --------------------------------
# Azure Bearer Token Authentication (when ocp5_workload_ols_get_token is true)
# Setting this to true will provision a unique Child App & SP in Azure
# Always set this to true for production workloads so that the secret is unique
# to the provision.
# Set to false to use API key authentication instead for development purposes
ocp5_workload_ols_get_token: true

# API Key Authentication (when ocp5_workload_ols_get_token is false)
# IMPORTANT: This must be set to your actual API key before deployment
# DO NOT commit real credentials to version control
ocp5_workload_ols_api_token: "changeme"

# Azure AD credentials for token-based authentication
# IMPORTANT: These must be set to actual values before deployment
# DO NOT commit real credentials to version control
ocp5_workload_ols_main_client_id: "changeme"
ocp5_workload_ols_main_client_secret: "changeme"
ocp5_workload_ols_azure_tenant_id: "changeme"
ocp5_workload_ols_azure_group_id: "changeme"
ocp5_workload_ols_child_app_display_name: "RHDP-lightspeed"

# --------------------------------
# LLM Provider Configuration
# --------------------------------

# Azure OpenAI configuration
ocp5_workload_ols_llm_providers_models_name: gpt-4
ocp5_workload_ols_llm_providers_provide_name: Azure
ocp5_workload_ols_llm_providers_provide_type: azure_openai
ocp5_workload_ols_llm_providers_url: 'https://llm-gpt4-lightspeed.cognitiveservices.azure.com/'
ocp5_workload_ols_llm_deploymentname: gpt-4
# this is only used during verification of Azure SP token
ocp5_workload_ols_azure_api_version: 2025-01-01-preview
# Use max_completion_tokens instead of max_tokens (required for gpt-5)
ocp5_workload_ols_use_max_completion_tokens: false
ocp5_workload_ols_max_completion_tokens: 1000

# Watson AI configuration (only used when ocp5_workload_ols_ai_platform is watson)
ocp5_workload_ols_watson_projectid: projectid

# OLS runtime configuration
ocp5_workload_ols_defaultmodel: gpt-4
ocp5_workload_ols_defaultprovider: Azure
ocp5_workload_ols_loglevel: DEBUG

# --------------------------------
# User Access Configuration
# --------------------------------

# Auth provider type: htpasswd or keycloak.
# Defaults to the value set by ocp5_workload_authentication (or ocp4_workload_authentication
# for backwards compatibility), or htpasswd if neither is present.
ocp5_workload_ols_auth_provider: >-
  {{ ocp5_workload_authentication_provider
     | default(ocp4_workload_authentication_provider
     | default('htpasswd')) }}

# Admin username to exclude when granting lightspeed-operator-query-access.
ocp5_workload_ols_admin_username: >-
  {{ ocp5_workload_authentication_admin_username
     | default(ocp4_workload_authentication_admin_username
     | default('admin')) }}

# --- htpasswd provider settings ---
# Name of the htpasswd secret in openshift-config namespace.
ocp5_workload_ols_htpasswd_secret_name: >-
  {{ ocp5_workload_authentication_htpasswd_secret_name
     | default(ocp4_workload_authentication_htpasswd_secret_name
     | default('htpasswd')) }}

# --- keycloak provider settings ---
# Namespace where Keycloak is installed.
ocp5_workload_ols_keycloak_namespace: >-
  {{ ocp5_workload_authentication_keycloak_namespace
     | default(ocp4_workload_authentication_keycloak_namespace
     | default('keycloak')) }}

# Keycloak realm name (also the KeycloakRealmImport CR name).
ocp5_workload_ols_keycloak_realm: >-
  {{ ocp5_workload_authentication_keycloak_default_realm
     | default(ocp4_workload_authentication_keycloak_default_realm
     | default('sso')) }}

# --------------------------------
# Debug and Demo Settings
# --------------------------------

# Enable debug output (shows sensitive token information)
# Set to true only for troubleshooting
ocp5_workload_ols_debug: false

# --------------------------------
# Agentic OLS (optional, disabled by default)
# --------------------------------

# Set to true to deploy the agentic OLS component on top of classic OLS
ocp5_workload_ols_enable_agentic: false

# User-provided OpenAI API key for the agentic component.
# INDEPENDENT from the Azure credentials used by classic OLS.
# IMPORTANT: Must be set to a real key when ocp5_workload_ols_enable_agentic is true.
# DO NOT commit real credentials to version control.
ocp5_workload_ols_agentic_api_key: "changeme"

# LLM model used by the agentic component
ocp5_workload_ols_agentic_model: gpt-4o

# Agentic operator source repository
ocp5_workload_ols_agentic_repo_url: https://github.com/openshift/lightspeed-agentic-operator
ocp5_workload_ols_agentic_repo_version: main

# Optional subsystem flags
ocp5_workload_ols_agentic_enable_alerts_adapter: true
ocp5_workload_ols_agentic_enable_console: true
ocp5_workload_ols_agentic_enable_postgres: false

# Image overrides — empty string uses the quickstart script defaults (Konflux :main)
ocp5_workload_ols_agentic_operator_image: ""
ocp5_workload_ols_agentic_sandbox_image: ""
ocp5_workload_ols_agentic_console_image: ""
ocp5_workload_ols_agentic_alerts_adapter_image: ""
ocp5_workload_ols_agentic_otel_image: ""
